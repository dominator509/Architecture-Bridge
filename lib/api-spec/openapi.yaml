    TenantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        metadata:
