        - environmentCount
        - packageCount
        - activeDeploymentCount
        - pendingApprovalCount
        - recentAuditEventCount

    # ── Workspace ─────────────────────────────────────────────────────────────
    Workspace:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: wrk_{nanoid}"
        tenantId:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, archived]
        metadata:
          $ref: "#/components/schemas/Metadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, name, slug, status, createdAt, updatedAt]

    WorkspaceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [name, slug]

    UpdateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        metadata:
          $ref: "#/components/schemas/Metadata"

    # ── Environment ───────────────────────────────────────────────────────────
    Environment:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: env_{nanoid}"
        workspaceId:
          type: string
        tenantId:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [development, staging, production]
        status:
          type: string
          enum: [active, inactive]
        metadata:
          $ref: "#/components/schemas/Metadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, workspaceId, tenantId, name, slug, type, status, createdAt, updatedAt]

    EnvironmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreateEnvironmentBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [development, staging, production]
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [name, slug, type]

    UpdateEnvironmentBody:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        metadata:
          $ref: "#/components/schemas/Metadata"

    # ── Package ───────────────────────────────────────────────────────────────
    Package:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: pkg_{nanoid}"
        tenantId:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, deprecated, archived]
        metadata:
          $ref: "#/components/schemas/Metadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, name, slug, status, createdAt, updatedAt]

    PackageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Package"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreatePackageBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [name, slug]

    # ── PackageVersion ────────────────────────────────────────────────────────
    PackageVersion:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: pkgv_{nanoid}"
        packageId:
          type: string
        tenantId:
          type: string
        version:
          type: string
          description: Semantic version string
        manifest:
          type: object
          additionalProperties: true
          description: Package manifest — agent config, capabilities, constraints
        status:
          type: string
          enum: [draft, published, deprecated]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, packageId, tenantId, version, manifest, status, createdAt, updatedAt]

    PackageVersionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PackageVersion"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreatePackageVersionBody:
      type: object
      properties:
        version:
          type: string
        manifest:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, published]
          default: draft
      required: [version, manifest]

    # ── Deployment ────────────────────────────────────────────────────────────
    Deployment:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: dep_{nanoid}"
        environmentId:
          type: string
        packageVersionId:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [pending, active, failed, stopped]
        configSnapshotId:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/Metadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, environmentId, packageVersionId, tenantId, status, createdAt, updatedAt]

    DeploymentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreateDeploymentBody:
      type: object
      properties:
        packageVersionId:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
      required: [packageVersionId]

    UpdateDeploymentBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, active, failed, stopped]
        metadata:
          $ref: "#/components/schemas/Metadata"

    # ── ConfigSnapshot ────────────────────────────────────────────────────────
    ConfigSnapshot:
      type: object
      description: >
        Immutable resolved config snapshot. Connector/provider resolution is
        a future-phase placeholder — manifest fields are stored as-is.
      properties:
        id:
          type: string
          description: "Prefixed ID: cfg_{nanoid}"
        deploymentId:
          type: string
        tenantId:
          type: string
        resolvedConfig:
          type: object
          additionalProperties: true
        schemaVersion:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, deploymentId, tenantId, resolvedConfig, schemaVersion, createdAt]

    ResolveConfigSnapshotBody:
      type: object
      properties:
        configOverrides:
          type: object
          additionalProperties: true
          description: >
            Optional caller-supplied overrides merged onto the package version
            manifest at resolution time. Provider-specific resolution is a
            future-phase concern.
        schemaVersion:
          type: string
          default: "1.0"
      required: []

    # ── AuditEvent ────────────────────────────────────────────────────────────
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: aud_{nanoid}"
        tenantId:
          type: string
        actorId:
          type: string
        actorType:
          type: string
          enum: [user, system, agent]
        eventType:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        payload:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, actorId, actorType, eventType, resourceType, resourceId, createdAt]

    AuditEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    # ── ActionLedger ──────────────────────────────────────────────────────────
    ActionLedgerEntry:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: act_{nanoid}"
        tenantId:
          type: string
        deploymentId:
          type: string
          nullable: true
        actionType:
          type: string
        actorId:
          type: string
        actorType:
          type: string
          enum: [user, system, agent]
        status:
          type: string
          enum: [pending, succeeded, failed, cancelled]
        requestPayload:
          type: object
          additionalProperties: true
          nullable: true
        responsePayload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, tenantId, actionType, actorId, actorType, status, createdAt]

    ActionLedgerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActionLedgerEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    # ── Approval ──────────────────────────────────────────────────────────────
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          description: "Prefixed ID: apr_{nanoid}"
        tenantId:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        action:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        requesterId:
          type: string
        reviewerId:
          type: string
          nullable: true
        requestPayload:
          type: object
          additionalProperties: true
          nullable: true
        decisionPayload:
          type: object
          additionalProperties: true
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, resourceType, resourceId, action, status, requesterId, createdAt, updatedAt]

    ApprovalRequestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequest"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    CreateApprovalRequestBody:
      type: object
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
        action:
          type: string
        requesterId:
          type: string
        requestPayload:
          type: object
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
      required: [resourceType, resourceId, action, requesterId]

    ApprovalDecisionBody:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reviewerId:
          type: string
        decisionPayload:
          type: object
          additionalProperties: true
      required: [decision, reviewerId]

    # ── Policy ────────────────────────────────────────────────────────────────
    PolicyEvaluationRequest:
      type: object
      description: >
        Default-deny policy evaluation. Full rule engine is a future-phase
        concern. Current skeleton always denies unless an explicit allow rule
        matches.
      properties:
        principal:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
              enum: [user, agent, system]
          required: [id, type]
        action:
          type: string
        resource:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
          required: [type, id]
        context:
          type: object
          additionalProperties: true
      required: [principal, action, resource]

    PolicyDecision:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        matchedRule:
          type: string
          nullable: true
        evaluatedAt:
          type: string
          format: date-time
      required: [allowed, reason, evaluatedAt]
