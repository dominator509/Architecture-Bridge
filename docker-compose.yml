name: architecture-bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: architecture_bridge
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d architecture_bridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://bridge:bridge@postgres:5432/architecture_bridge
    command: ["corepack", "pnpm", "--filter", "@workspace/db", "run", "push"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://bridge:bridge@postgres:5432/architecture_bridge
      ALLOWED_ORIGINS: http://localhost:33000
      DOCKER_RUNTIME_ENABLED: "true"
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      AGENT_RUNTIME_IMAGE: node:22-alpine
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    ports:
      - "33000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
