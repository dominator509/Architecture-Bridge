name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: architecture_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d architecture_bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://bridge:bridge@localhost:5432/architecture_bridge
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: npm_config_user_agent=pnpm/ci corepack pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Push database schema
        run: corepack pnpm --filter @workspace/db run push

      - name: Build
        run: corepack pnpm run build

      - name: API tests
        run: corepack pnpm --filter @workspace/api-server test
